# Keeps the commit-pinned GitHub Actions and the digest-pinned base
# images in the Dockerfile up to date. Go modules are left out:
# updating them also needs `make notices`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
