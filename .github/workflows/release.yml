name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  id-token: write     # sign the build provenance
  attestations: write # store it

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # The tag ends up in shell commands (and in the binary through
      # make), so accept only plain version tags.
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "unexpected tag: $TAG"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -tags "$(cat build-tags.txt)" -short ./...
      - name: Build
        env:
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest
        run: make release GO=go VERSION="$TAG" DOWNLOAD_URL="$DOWNLOAD_URL"
      # Lets anyone check a download was built here from this tag:
      #   gh attestation verify <file> --repo <owner>/<repo>
      # GitHub only offers attestations for private repositories on
      # Enterprise plans, so this runs once the repository is public.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/taillan-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --generate-notes --title "TailLAN $TAG"

  # The container image (docs/server.md), for linux/amd64 and arm64.
  # The first push creates the ghcr.io package as private: make it
  # public once in its package settings, or "docker pull" fails.
  image:
    needs: release  # only publish an image for a tag that released
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # push to ghcr.io
      id-token: write     # sign the build provenance
      attestations: write # store it
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "unexpected tag: $TAG"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${REPO,,}"
          tags=(--tag "$image:$TAG")
          # Pre-releases (v1.2.0-rc.1) don't move "latest".
          [[ "$TAG" == *-* ]] || tags+=(--tag "$image:latest")
          echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          # BuildKit pinned by digest, like the base images.
          docker buildx create --use \
            --driver-opt image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$TAG" \
            --build-arg DOWNLOAD_URL="https://github.com/$REPO/releases/latest" \
            "${tags[@]}" --metadata-file meta.json --push .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "DIGEST=$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_ENV"
      # Lets anyone check the image was built here from this tag:
      #   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --repo <owner>/<repo>
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
