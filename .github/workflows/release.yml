name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  id-token: write     # sign the build provenance
  attestations: write # store it

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # The tag ends up in shell commands (and in the binary through
      # make), so accept only plain version tags.
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "unexpected tag: $TAG"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -tags "$(cat build-tags.txt)" -short ./...
      - name: Build
        env:
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/latest
        run: make release GO=go VERSION="$TAG" DOWNLOAD_URL="$DOWNLOAD_URL"
      # Lets anyone check a download was built here from this tag:
      #   gh attestation verify <file> --repo <owner>/<repo>
      # GitHub only offers attestations for private repositories on
      # Enterprise plans, so this runs once the repository is public.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/taillan-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --generate-notes --title "TailLAN $TAG"
