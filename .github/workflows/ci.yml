name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Vet
        if: runner.os == 'Linux'
        run: make vet GO=go
      - name: Third-party notices up to date
        if: runner.os == 'Linux'
        run: make notices GO=go && git diff --exit-code THIRD_PARTY_NOTICES.txt
      - name: Test
        shell: bash
        # The host/join round trip uses tailcat's public (rate-limited)
        # relays, so it runs on one OS only; -short skips it elsewhere.
        run: go test -tags "$(cat build-tags.txt)" -count=1 ${{ runner.os != 'Linux' && '-short' || '' }} ./...
      - name: Cross-compile
        if: runner.os == 'Linux'
        run: make release GO=go
