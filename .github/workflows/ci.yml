name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        if: runner.os == 'Linux'
        run: make vet GO=go
      - name: Third-party notices up to date
        if: runner.os == 'Linux'
        run: make notices GO=go && git diff --exit-code THIRD_PARTY_NOTICES.txt
      - name: Test
        shell: bash
        # The host/join round trip uses tailcat's public (rate-limited)
        # relays, so it runs on one OS only; -short skips it elsewhere.
        run: go test -tags "$(cat build-tags.txt)" -count=1 ${{ runner.os != 'Linux' && '-short' || '' }} ./...
      - name: Cross-compile
        if: runner.os == 'Linux'
        run: make release GO=go

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image builds with the Go in go.mod
        run: |
          want=$(awk '$1 == "go" { print $2 }' go.mod)
          got=$(sed -n 's/^FROM .*golang:\([0-9.]*\)@.*/\1/p' Dockerfile)
          [[ "$got" == "$want" ]] || { echo "Dockerfile builds with Go $got, go.mod says $want: update them together"; exit 1; }
      - name: Build image
        run: docker build -t taillan:ci .
      - name: Smoke test
        # Shares a port over tailcat's public relays from inside the
        # container, then drives it the way docs/server.md describes.
        run: |
          set -euo pipefail
          trap 'docker logs tl 2>&1 | tail -n 50 || true' ERR
          docker run --rm taillan:ci version
          docker run --rm taillan:ci games valheim
          if docker run --rm taillan:ci status; then echo "status should exit 1 with nothing running"; exit 1; fi
          docker run -d --name tl -e TAILLAN_NAME="CI game" -e TAILLAN_PRINT_INVITE=false \
            taillan:ci host 47123/tcp --invite-file /data/invite.txt
          for _ in $(seq 60); do docker exec tl taillan status --quiet && break; sleep 2; done
          docker exec tl taillan status
          docker exec tl taillan invite | grep -q '^TL1-'
          docker cp tl:/data/invite.txt invite.txt && grep -q '^TL1-' invite.txt
          docker exec tl taillan lock
          docker exec tl taillan status --json | grep -q '"locked": true'
          docker exec tl taillan stop
          [ "$(docker wait tl)" = 0 ]
          logs=$(docker logs tl 2>&1)
          if grep -q 'TL1-' <<<"$logs"; then echo "invite code printed despite --print-invite=false"; exit 1; fi
